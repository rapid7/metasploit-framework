schema: meterpreter-micro/v1
profile: micro-stdapi-yaml
platform: windows
architecture: [x64, x86]
metapi_source_commit: 0aa09117dcee240eb92b3d559a01593dccd44c14
objects:
  - name: micro-stdapi-sysinfo
    file:
      x64: ../../build/sysinfo.x64.o
      x86: ../../build/sysinfo.x86.o
    commands:
      - { id: 1059, name: stdapi_sys_config_sysinfo }
    ui:
      commands:
        - name: sysinfo
          description: Display target system information
          request:
            command: 1059
          response:
            fields:
              - { name: computer, type: string, tlv: 1040 }
              - { name: os, type: string, tlv: 1041 }
              - { name: arch, type: string, tlv: 1043 }
              - { name: language, type: string, tlv: 1044 }
          output:
            lines:
              - "Computer:        %{computer}"
              - "OS:              %{os}"
              - "Architecture:    %{arch}"
              - "System Language: %{language}"
  - name: micro-stdapi-listing
    file:
      x64: ../../build/listing.x64.o
      x86: ../../build/listing.x86.o
    commands:
      - { id: 1008, name: stdapi_fs_getwd }
      - { id: 1009, name: stdapi_fs_ls }
      - { id: 1016, name: stdapi_fs_stat }
    ui:
      commands:
        - name: pwd
          description: Display the target working directory
          request:
            command: 1008
          response:
            fields:
              - { name: path, type: string, tlv: 1200 }
          output:
            format: "Working directory: %{path}"
        - name: ls
          description: List a target directory
          request:
            command: 1009
            arguments:
              - { name: path, type: string, tlv: 1200, required: false, default: "." }
          response:
            rows:
              - { name: name, type: string, tlv: 1201 }
              - name: stat
                type: raw
                tlv: 1221
                extract:
                  - { name: mode, type: uint, offset: 4 }
                  - { name: size, type: qword, offset: 32 }
                  - { name: modified, type: qword, offset: 48 }
          output:
            type: table
            header: Listing
            columns:
              - { label: Mode, name: mode, display: octal }
              - { label: Size, name: size }
              - { label: Modified, name: modified, display: unix_time }
              - { label: Name, name: name }
        - name: stat
          description: Display target file metadata
          request:
            command: 1016
            arguments:
              - { name: path, type: string, tlv: 1202 }
          response:
            rows:
              - name: stat
                type: raw
                tlv: 1221
                extract:
                  - { name: mode, type: uint, offset: 4 }
                  - { name: size, type: qword, offset: 32 }
                  - { name: accessed, type: qword, offset: 40 }
                  - { name: modified, type: qword, offset: 48 }
                  - { name: created, type: qword, offset: 56 }
          output:
            type: table
            header: File metadata
            columns:
              - { label: Mode, name: mode, display: octal }
              - { label: Size, name: size }
              - { label: Accessed, name: accessed, display: unix_time }
              - { label: Modified, name: modified, display: unix_time }
              - { label: Created, name: created, display: unix_time }
  - name: micro-stdapi-file-channel
    file:
      x64: ../../build/fs_file.x64.o
      x86: ../../build/fs_file.x86.o
    channels: [stdapi_fs_file]
    commands: []
    client:
      adapter: stdapi_fs
      expose: []
    ui:
      commands:
        - name: cat
          description: Read a target file
          delegate: { adapter: stdapi_fs, command: cat }
        - name: download
          description: Download a target file or directory
          delegate: { adapter: stdapi_fs, command: download }
        - name: edit
          description: Edit a target text file
          delegate: { adapter: stdapi_fs, command: edit }
        - name: upload
          description: Upload a local file or directory
          delegate: { adapter: stdapi_fs, command: upload }
  - name: micro-stdapi-fs-operations
    file:
      x64: ../../build/fs_operations.x64.o
      x86: ../../build/fs_operations.x86.o
    commands:
      - { id: 1001, name: stdapi_fs_chdir }
      - { id: 1002, name: stdapi_fs_chmod }
      - { id: 1003, name: stdapi_fs_delete_dir }
      - { id: 1004, name: stdapi_fs_delete_file }
      - { id: 1005, name: stdapi_fs_file_copy }
      - { id: 1006, name: stdapi_fs_file_expand_path }
      - { id: 1007, name: stdapi_fs_file_move }
      - { id: 1011, name: stdapi_fs_mkdir }
      - { id: 1014, name: stdapi_fs_separator }
    ui:
      commands:
        - name: cd
          description: Change the target working directory
          request:
            command: 1001
            arguments:
              - { name: path, type: string, tlv: 1200 }
          output: { format: "Directory changed." }
        - name: chmod
          description: Change target file write permissions
          request:
            command: 1002
            arguments:
              - { name: path, type: string, tlv: 1202 }
              - { name: mode, type: uint, tlv: 1234 }
          output: { format: "Permissions changed." }
        - name: rmdir
          description: Remove an empty target directory
          request:
            command: 1003
            arguments:
              - { name: path, type: string, tlv: 1200 }
          output: { format: "Directory removed." }
        - name: rm
          description: Remove a target file
          request:
            command: 1004
            arguments:
              - { name: path, type: string, tlv: 1202 }
          output: { format: "File removed." }
        - name: cp
          description: Copy a target file
          request:
            command: 1005
            arguments:
              - { name: source, type: string, tlv: 1201 }
              - { name: destination, type: string, tlv: 1202 }
          output: { format: "File copied." }
        - name: expand_path
          description: Expand environment variables in a target path
          request:
            command: 1006
            arguments:
              - { name: path, type: string, tlv: 1202 }
          response:
            fields:
              - { name: path, type: string, tlv: 1202 }
          output: { format: "%{path}" }
        - name: mv
          description: Move a target file
          request:
            command: 1007
            arguments:
              - { name: source, type: string, tlv: 1201 }
              - { name: destination, type: string, tlv: 1202 }
          output: { format: "File moved." }
        - name: mkdir
          description: Create a target directory
          request:
            command: 1011
            arguments:
              - { name: path, type: string, tlv: 1200 }
          output: { format: "Directory created." }
        - name: separator
          description: Display the target directory separator
          request:
            command: 1014
          response:
            fields:
              - { name: separator, type: string, tlv: 10 }
          output: { format: "%{separator}" }
  - name: micro-stdapi-fs-hash
    file:
      x64: ../../build/fs_hash.x64.o
      x86: ../../build/fs_hash.x86.o
    commands:
      - { id: 1010, name: stdapi_fs_md5 }
      - { id: 1015, name: stdapi_fs_sha1 }
    ui:
      commands:
        - name: md5
          description: Calculate a target file MD5 digest
          request:
            command: 1010
            arguments:
              - { name: path, type: string, tlv: 1202 }
          response:
            fields:
              - { name: digest, type: raw, tlv: 1206 }
          output: { format: "%{digest}" }
        - name: sha1
          description: Calculate a target file SHA1 digest
          request:
            command: 1015
            arguments:
              - { name: path, type: string, tlv: 1202 }
          response:
            fields:
              - { name: digest, type: raw, tlv: 1206 }
          output: { format: "%{digest}" }
  - name: micro-stdapi-fs-mount
    file:
      x64: ../../build/fs_mount.x64.o
      x86: ../../build/fs_mount.x86.o
    commands:
      - { id: 1012, name: stdapi_fs_mount_show }
    ui:
      commands:
        - name: mounts
          description: Display target mount points
          request:
            command: 1012
          response:
            rows:
              - name: mount
                type: group
                tlv: 1207
                fields:
                  - { name: name, type: string, tlv: 1208 }
                  - { name: type, type: uint, tlv: 1209 }
                  - { name: available, type: qword, tlv: 1210 }
                  - { name: total, type: qword, tlv: 1211 }
                  - { name: free, type: qword, tlv: 1212 }
                  - { name: unc, type: string, tlv: 1213 }
          output:
            type: table
            header: Mounts
            columns:
              - { label: Name, name: name }
              - { label: Type, name: type }
              - { label: Available, name: available }
              - { label: Total, name: total }
              - { label: Free, name: free }
              - { label: UNC, name: unc }
  - name: micro-stdapi-fs-search
    file:
      x64: ../../build/fs_search.x64.o
      x86: ../../build/fs_search.x86.o
    commands:
      - { id: 1013, name: stdapi_fs_search }
    ui:
      commands:
        - name: search
          description: Search target files
          request:
            command: 1013
            arguments:
              - { name: glob, type: string, tlv: 1231 }
              - { name: root, type: string, tlv: 1232, required: false, default: "." }
              - { name: recurse, type: bool, tlv: 1230, required: false, default: "true" }
          response:
            rows:
              - name: result
                type: group
                tlv: 1233
                fields:
                  - { name: path, type: string, tlv: 1202 }
                  - { name: name, type: string, tlv: 1201 }
                  - { name: size, type: uint, tlv: 1204 }
                  - { name: modified, type: uint, tlv: 1235 }
          output:
            type: table
            header: Search results
            columns:
              - { label: Path, name: path }
              - { label: Name, name: name }
              - { label: Size, name: size }
              - { label: Modified, name: modified, display: unix_time }
  - name: micro-stdapi-railgun-api
    file:
      x64: ../../build/railgun_api.x64.o
      x86: ../../build/railgun_api.x86.o
    limits:
      max_arguments: 16
    commands:
      - { id: 1028, name: stdapi_railgun_api }
    client:
      adapter: stdapi_railgun
      expose: []
