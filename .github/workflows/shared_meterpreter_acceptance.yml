name: Shared Meterpreter Acceptance
on:
  workflow_call:
    inputs:
      metasploit_framework_repository:
        description: "metasploit-framework repository to test"
        default: 'rapid7/metasploit-framework'
        required: false
        type: string
      # Empty commit inputs use the corresponding repository's default branch.
      metasploit_framework_commit:
        description: "metasploit-framework commit to build with"
        default: ''
        required: false
        type: string
      metasploit_payloads_commit:
        description: "metasploit-payloads commit to build with"
        default: ''
        required: false
        type: string
      mettle_commit:
        description: "mettle commit to build with"
        default: ''
        required: false
        type: string
      build_mettle:
        description: "Whether or not to build mettle"
        default: false
        required: false
        type: boolean
      build_metasploit_payloads:
        description: "Whether or not to build metasploit-payloads"
        default: false
        required: false
        type: boolean

env:
  # gnu.org has frequent downtime, so use the mirror at nokogiri.org
  NOKOGIRI_USE_MIRRORED_GNU_SOURCE: "t"

jobs:
  # Compile Java Meterpreter and prepare PHP/Python payloads via docker if required, we can't
  # always do this on the host environment (i.e. for macos). So it instead gets compiled first
  # on a linux host, then the artifacts are copied back to the host later
  meterpreter_compilation:
    name: Build Meterpreter Gem (optional)
    runs-on: ubuntu-latest
    if: ${{ inputs.build_metasploit_payloads }}
    outputs:
      metasploit_payloads_commit: ${{ steps.payloads_revision.outputs.commit }}

    steps:
      - name: Checkout metasploit-payloads
        uses: actions/checkout@v4
        with:
          repository: rapid7/metasploit-payloads
          path: metasploit-payloads
          ref: ${{ inputs.metasploit_payloads_commit }}

      - name: Record metasploit-payloads revision
        id: payloads_revision
        working-directory: metasploit-payloads
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Java, PHP and Python payloads
        run: |
          mkdir "$(pwd)/meterpreter-artifacts"
          docker run --rm -w "$(pwd)" -v "$(pwd):$(pwd)" rapid7/msf-ubuntu-x64-meterpreter:latest /bin/bash -c "cd metasploit-payloads/gem && rake create_dir && rake php_prep && rake java_prep && rake python_prep && rake create_manifest && rake build"
          cp "$(pwd)"/metasploit-payloads/gem/pkg/metasploit-payloads-* "$(pwd)/meterpreter-artifacts"

      - name: Store Meterpreter artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meterpreter-artifacts
          path: meterpreter-artifacts

  # Run all test individually, note there is a separate final job for aggregating the test results
  test:
    needs: meterpreter_compilation
    if: always() && (needs.meterpreter_compilation.result == 'success' || needs.meterpreter_compilation.result == 'skipped')

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - windows-2022
          - ubuntu-latest
        ruby:
          - '3.4'
        meterpreter:
          # Python
          - { name: python, runtime_version: 3.8 }
          - { name: python, runtime_version: 3.11 }

          # Java
          - { name: java, runtime_version: 8 }
          - { name: java, runtime_version: 21 }

          # PHP
          - { name: php, runtime_version: 5.3 }
          - { name: php, runtime_version: 7.4 }
          - { name: php, runtime_version: 8.3 }
        exclude:
          # PHP 7.4/8.3 cannot be provisioned on Intel macOS: Homebrew no longer ships Intel-macOS
          # bottles, so setup-php builds from source and hits its no-output watchdog. Meterpreter has
          # no macOS arm64 support, so there is no viable macOS host+install path -- PHP coverage is
          # retained on Linux/Windows (php is interpreter-level, same payload path).
          - { os: macos-15-intel, meterpreter: { name: php, runtime_version: 7.4 } }
          - { os: macos-15-intel, meterpreter: { name: php, runtime_version: 8.3 } }
        include:
          # Windows Meterpreter
          - { meterpreter: { name: windows_meterpreter }, ruby: '3.4', os: windows-2022 }
          # TODO: Screenshotting behavior fails:
          # - { meterpreter: { name: windows_meterpreter }, ruby: '3.4', os: windows-2025 }

          # Mettle
          - { meterpreter: { name: mettle }, os: macos-15-intel }
          - { meterpreter: { name: mettle }, os: ubuntu-latest }

    runs-on: ${{ matrix.os }}

    # Source builds and the full acceptance suite share this job budget.
    timeout-minutes: ${{ ((inputs.build_mettle && matrix.meterpreter.name == 'mettle') || (inputs.build_metasploit_payloads && matrix.meterpreter.name == 'windows_meterpreter')) && 75 || 60 }}

    env:
      RAILS_ENV: test
      HOST_RUNNER_IMAGE: ${{ matrix.os }}
      SESSION: 'meterpreter/${{ matrix.meterpreter.name }}'
      SESSION_RUNTIME_VERSION: ${{ matrix.meterpreter.runtime_version }}
      BUNDLE_WITHOUT: "coverage development"
      PAYLOADS_GEM_NAME: ${{ matrix.meterpreter.name == 'mettle' && 'metasploit_payloads-mettle' || 'metasploit-payloads' }}

    name: ${{ matrix.meterpreter.name }} ${{ matrix.meterpreter.runtime_version }} ${{ matrix.os }}
    steps:
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get -y --no-install-recommends install libpcap-dev graphviz

      # Use setup-php@2.31.1 for Windows (PHP 5.3 on windows-2022 is broken with later versions while PHP 7.4 and 8.3
      # are broken on MacOS with this version)
      - name: Use setup-php@2.31.1 to install PHP for Windows runners
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231
        if: ${{ matrix.meterpreter.name == 'php' && runner.os == 'Windows' }}
        with:
          php-version: ${{ matrix.meterpreter.runtime_version }}
          tools: none

      - name: Use setup-php@2.37.0 to install PHP for non-Windows runners
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f
        if: ${{ matrix.meterpreter.name == 'php' && runner.os != 'Windows' }}
        with:
          php-version: ${{ matrix.meterpreter.runtime_version }}
          tools: none

      - name: Set up Python
        if: ${{ matrix.meterpreter.name == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.meterpreter.runtime_version }}

      - uses: actions/setup-java@v4
        if: ${{ matrix.meterpreter.name == 'java' }}
        with:
          distribution: temurin
          java-version: ${{ matrix.meterpreter.runtime_version }}

      - name: Install system dependencies (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          # pcap dependencies
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri 'https://www.winpcap.org/install/bin/WpdPack_4_1_2.zip' -OutFile 'C:\Windows\Temp\WpdPack_4_1_2.zip' -SkipCertificateCheck
          $expected = 'ea799cf2f26e4afb1892938070fd2b1ca37ce5cf75fec4349247df12b784edbd'
          $actual = (Get-FileHash 'C:\Windows\Temp\WpdPack_4_1_2.zip' -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "WpdPack_4_1_2.zip SHA256 mismatch: expected $expected, got $actual" }

          choco install 7zip -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install 7zip failed with exit code $LASTEXITCODE" }

          7z x "C:\Windows\Temp\WpdPack_4_1_2.zip" -o"C:\"
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed with exit code $LASTEXITCODE" }

      # The job checkout structure is:
      #  .
      #  ├── metasploit-framework
      #  └── metasploit-payloads (Only if the "payload-testing-branch" GitHub label is applied)
      #  └── mettle (Only if the "payload-testing-mettle-branch" GitHub label is applied)
      - name: Checkout mettle
        if: ${{ matrix.meterpreter.name == 'mettle' && inputs.build_mettle }}
        uses: actions/checkout@v4
        with:
          repository: rapid7/mettle
          path: mettle
          ref: ${{ inputs.mettle_commit }}

      - name: Get mettle version
        if: ${{ matrix.meterpreter.name == 'mettle' && inputs.build_mettle }}
        run: echo "METTLE_VERSION=$(ruby -ne "puts Regexp.last_match(1) if /VERSION\s+=\s+'([^']+)'/" lib/metasploit_payloads/mettle/version.rb)" | tee -a $GITHUB_ENV
        working-directory: mettle

      - name: Prerequisite mettle gem setup
        if: ${{ matrix.meterpreter.name == 'mettle' && inputs.build_mettle }}
        run: |
          set -x
          ruby -pi.bak -e "gsub(/${{ env.METTLE_VERSION }}/, '${{ env.METTLE_VERSION }}-dev')" lib/metasploit_payloads/mettle/version.rb
        working-directory: mettle

      - name: Compile mettle payloads
        if: ${{ matrix.meterpreter.name == 'mettle' && runner.os != 'macos' && inputs.build_mettle }}
        run: |
          docker run --rm=true --tty --volume=$(pwd):/mettle --workdir=/mettle rapid7/build:mettle rake mettle:build mettle:check
          rake build
        working-directory: mettle

      - name: Compile mettle payloads - macOS
        if: ${{ matrix.meterpreter.name == 'mettle' && runner.os == 'macos' && inputs.build_mettle }}
        run: |
          make TARGET=x86_64-apple-darwin
          rake build
        working-directory: mettle

      - name: Checkout metasploit-framework commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.metasploit_framework_repository }}
          path: metasploit-framework
          ref: ${{ inputs.metasploit_framework_commit }}

      # https://github.com/orgs/community/discussions/26952
      - name: Support longpaths when running on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      # Bundler clones its Git cache locally; background maintenance can change
      # commit-graph files while Git is validating their hardlinks.
      - name: Complete Git maintenance before Bundler
        run: git config --global maintenance.autoDetach false

      - name: Setup Ruby
        env:
          # Introduces flakiness when downloading zlib etc: https://github.com/sparklemotion/nokogiri/issues/3521
          # BUNDLE_FORCE_RUBY_PLATFORM: true
          # Required for macos13 pg gem compilation
          PKG_CONFIG_PATH: "/usr/local/opt/libpq/lib/pkgconfig"
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Runtime setup can add native libraries (for example, PHP's libffi).
          # Do not restore those compiled gems into a different runtime job.
          cache-version: 6-${{ matrix.meterpreter.name }}-${{ matrix.meterpreter.runtime_version }}
          working-directory: metasploit-framework

      - name: Move mettle gem into framework
        if: ${{ matrix.meterpreter.name == 'mettle' && inputs.build_mettle }}
        run: |
          cp ../mettle/pkg/metasploit_payloads-mettle-${{ env.METTLE_VERSION }}.pre.dev.gem .
        working-directory: metasploit-framework

      - uses: actions/download-artifact@v4
        name: Download Meterpreter
        if: ${{ matrix.meterpreter.name != 'mettle' && inputs.build_metasploit_payloads }}
        with:
          name: meterpreter-artifacts
          path: metasploit-framework

      - name: Checkout metasploit-payloads
        if: ${{ inputs.build_metasploit_payloads && matrix.meterpreter.name != 'mettle' }}
        uses: actions/checkout@v4
        with:
          repository: rapid7/metasploit-payloads
          path: metasploit-payloads
          # Match the artifact's checkout even if the requested branch moves during the run.
          ref: ${{ needs.meterpreter_compilation.outputs.metasploit_payloads_commit }}
          submodules: ${{ matrix.meterpreter.name == 'windows_meterpreter' && 'recursive' || 'false' }}

      - name: Install Windows Meterpreter build dependencies
        shell: pwsh
        if: ${{ matrix.meterpreter.name == 'windows_meterpreter' && inputs.build_metasploit_payloads }}
        run: |
          $installPath = "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise"
          $configPath = (Resolve-Path 'c/meterpreter/vs-configs/vs2022.vsconfig').Path
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $arguments = @('modify', '--installPath', "`"$installPath`"", '--config', "`"$configPath`"", '--add', 'Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64', '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -eq 3010) {
            throw 'Windows Meterpreter build dependencies require a reboot. Compilation cannot continue on this hosted runner; provision the components in the runner image.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Installing Windows Meterpreter build dependencies failed with exit code $($process.ExitCode)"
          }
        working-directory: metasploit-payloads

      - name: Build Windows Meterpreter DLLs
        shell: cmd
        if: ${{ matrix.meterpreter.name == 'windows_meterpreter' && inputs.build_metasploit_payloads }}
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          if errorlevel 1 exit /b %errorlevel%
          rem Keep the source-compatible legacy SDK and the published compiler family.
          rem The legacy SDK selection does not establish XP compatibility.
          rem The default 14.16 build fails to reflectively load Kiwi on x64 release builds.
          msbuild.exe make.msbuild /target:all /p:PlatformToolset=v141_xp /p:VCToolsVersion=14.29.30133 /p:XPDeprecationWarning=false
        working-directory: metasploit-payloads/c/meterpreter/workspace

      - name: Package Windows Meterpreter DLLs
        if: ${{ matrix.meterpreter.name == 'windows_meterpreter' && inputs.build_metasploit_payloads }}
        shell: bash
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/metasploit-framework/Gemfile
        run: |
          bundle exec rake --rakefile "$PWD/Rakefile" -Ilib create_dir win_copy create_manifest build
          cp pkg/metasploit-payloads-*.gem ../../metasploit-framework/
        working-directory: metasploit-payloads/gem

      - name: Get metasploit-payloads version
        if: ${{ inputs.build_metasploit_payloads && matrix.meterpreter.name != 'mettle' }}
        shell: bash
        run: echo "METASPLOIT_PAYLOADS_VERSION=$(ruby -ne "puts Regexp.last_match(1) if /VERSION\s+=\s+'([^']+)'/" gem/lib/metasploit-payloads/version.rb)" | tee -a "$GITHUB_ENV"
        working-directory: metasploit-payloads

      - name: Use the candidate payloads package
        if: ${{ (inputs.build_mettle && matrix.meterpreter.name == 'mettle') || (inputs.build_metasploit_payloads && matrix.meterpreter.name != 'mettle') }}
        shell: bash
        run: |
          ruby <<'RUBY'
          require 'fileutils'
          require 'rubygems/package'

          gem_name = ENV.fetch('PAYLOADS_GEM_NAME')
          version = if gem_name == 'metasploit_payloads-mettle'
                      "#{ENV.fetch('METTLE_VERSION')}.pre.dev"
                    else
                      ENV.fetch('METASPLOIT_PAYLOADS_VERSION')
                    end
          package = Gem::Package.new("#{gem_name}-#{version}.gem")
          spec = package.spec
          abort 'Unexpected candidate payloads package' unless spec.name == gem_name && spec.version.to_s == version

          # A path source also selects this candidate when RubyGems has the same version.
          candidate_path = File.join('vendor', 'payloads-candidate', spec.full_name)
          FileUtils.mkdir_p(candidate_path)
          package.extract_files(candidate_path)
          File.write(File.join(candidate_path, "#{spec.name}.gemspec"), spec.to_ruby)

          gemspec_path = 'metasploit-framework.gemspec'
          gemspec = File.read(gemspec_path)
          dependency = /^(\s*spec\.add_runtime_dependency '#{Regexp.escape(gem_name)}', )'[^']+'/
          abort 'Framework payloads dependency not found' unless gemspec.match?(dependency)
          File.write(gemspec_path, gemspec.sub(dependency) { "#{Regexp.last_match(1)}'#{version}'" })
          File.open('Gemfile', 'a') { |file| file.puts "\ngem #{gem_name.inspect}, path: #{candidate_path.inspect}" }
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |file|
            file.puts "CANDIDATE_PAYLOADS_VERSION=#{version}"
            file.puts "CANDIDATE_PAYLOADS_PATH=#{candidate_path}"
          end
          RUBY
        working-directory: metasploit-framework

      - name: Bundle update/install candidate payloads gem
        if: ${{ (inputs.build_mettle && matrix.meterpreter.name == 'mettle') || (inputs.build_metasploit_payloads && matrix.meterpreter.name != 'mettle') }}
        shell: bash
        run: |
          bundle config unset deployment
          # Keep the payload-gem update on the precompiled Windows gem platform.
          ${{ runner.os == 'Windows' && 'bundle lock --add-platform x64-mingw-ucrt' || 'echo "Skipping Windows Bundler platform lock"' }}
          bundle update "$PAYLOADS_GEM_NAME"
          bundle install --deployment
        working-directory: metasploit-framework

      - name: Verify the candidate payloads are selected
        if: ${{ (inputs.build_mettle && matrix.meterpreter.name == 'mettle') || (inputs.build_metasploit_payloads && matrix.meterpreter.name != 'mettle') }}
        shell: bash
        env:
          METASPLOIT_PAYLOADS_COMMIT: ${{ needs.meterpreter_compilation.outputs.metasploit_payloads_commit }}
        run: |
          bundle exec ruby <<'RUBY'
          gem_name = ENV.fetch('PAYLOADS_GEM_NAME')
          version = ENV.fetch('CANDIDATE_PAYLOADS_VERSION')
          candidate_path = File.realpath(ENV.fetch('CANDIDATE_PAYLOADS_PATH'))
          spec = Gem.loaded_specs.fetch(gem_name)
          abort "Expected payloads #{version}, loaded #{spec.version}" unless spec.version.to_s == version
          abort "Payloads loaded from #{spec.full_gem_path}" unless File.realpath(spec.full_gem_path) == candidate_path

          puts "Using #{gem_name} #{version} from #{spec.full_gem_path}"

          if gem_name == 'metasploit_payloads-mettle'
            require 'metasploit_payloads/mettle'
            triple = ENV.fetch('RUNNER_OS') == 'macOS' ? 'x86_64-apple-darwin' : 'x86_64-linux-musl'
            filenames = ['mettle']
            filenames << 'mettle.bin' unless ENV.fetch('RUNNER_OS') == 'macOS'
            filenames.each do |filename|
              path = MetasploitPayloads::Mettle.path(triple, 'bin', filename)
              abort "Missing required Mettle payload: #{triple}/#{filename}" unless path && File.file?(path)
              abort "Mettle payload outside candidate package: #{path}" unless File.realpath(path).start_with?("#{candidate_path}/")
              puts path
            end
          else
            require 'metasploit-payloads'
            errors = MetasploitPayloads.manifest_errors
            abort "Candidate payload manifest errors: #{errors.inspect}" unless errors.empty?
            puts "Built from #{ENV.fetch('METASPLOIT_PAYLOADS_COMMIT')}"
          end

          if ENV.fetch('SESSION') == 'meterpreter/windows_meterpreter'
            %w[x86 x64].each do |arch|
              [false, true].each do |debug|
                %w[metsrv ext_server_stdapi ext_server_kiwi].each do |name|
                  path = MetasploitPayloads.meterpreter_path(name, "#{arch}.dll", debug: debug)
                  abort "Missing required Windows Meterpreter DLL: #{name} #{arch} (debug=#{debug})" unless path && File.file?(path)
                  abort "DLL outside candidate payloads: #{path}" unless File.realpath(path).start_with?("#{candidate_path}/")
                  puts path
                end
              end
            end
          end
          RUBY
        working-directory: metasploit-framework

      - name: Acceptance
        env:
          SPEC_HELPER_LOAD_METASPLOIT: false
          SPEC_OPTS: "--tag acceptance --require acceptance_spec_helper.rb --color --format documentation --format AllureRspec::RSpecFormatter"
        # Unix run command:
        #   SPEC_HELPER_LOAD_METASPLOIT=false bundle exec ./spec/acceptance
        # Windows cmd command:
        #   set SPEC_HELPER_LOAD_METASPLOIT=false
        #   bundle exec rspec .\spec\acceptance
        # Note: rspec retry is intentionally not used, as it can cause issues with allure's reporting
        # Additionally - flakey tests should be fixed or marked as flakey instead of silently retried
        # A failed native extension can leave the shared console blocked; stop that job
        # while the other matrix jobs finish.
        run: |
          bundle exec rspec spec/acceptance/meterpreter_spec.rb ${{ matrix.meterpreter.name == 'windows_meterpreter' && '--fail-fast' || '' }}
        working-directory: metasploit-framework

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Provide a unique artifact for each matrix os, otherwise race conditions can lead to corrupt zips
          name: raw-data-${{ matrix.meterpreter.name }}-${{ matrix.meterpreter.runtime_version }}-${{ matrix.os }}
          path: metasploit-framework/tmp/allure-raw-data

  # Generate a final report from the previous test results
  report:
    name: Generate report
    needs: [test]
    runs-on: ubuntu-latest
    if: always() && needs.test.result != 'skipped'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        if: always()
        with:
          repository: ${{ inputs.metasploit_framework_repository }}
          ref: ${{ inputs.metasploit_framework_commit }}

      - name: Install system dependencies (Linux)
        if: always()
        run: sudo apt-get -y --no-install-recommends install libpcap-dev graphviz

      # https://github.com/orgs/community/discussions/26952
      - name: Support longpaths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Setup Ruby
        if: always()
        env:
          BUNDLE_FORCE_RUBY_PLATFORM: true
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 5

      - uses: actions/download-artifact@v4
        id: raw_report_data
        if: always()
        with:
          # Note: Not specifying a name will download all artifacts from the previous workflow jobs
          path: raw-data

      - name: allure generate
        if: always()
        run: |
          export VERSION=2.22.1

          curl -o allure-$VERSION.tgz -Ls https://github.com/allure-framework/allure2/releases/download/$VERSION/allure-$VERSION.tgz
          tar -zxvf allure-$VERSION.tgz -C .

          ls -la ${{steps.raw_report_data.outputs.download-path}}
          ./allure-$VERSION/bin/allure generate ${{steps.raw_report_data.outputs.download-path}}/* -o ./allure-report

          find ${{steps.raw_report_data.outputs.download-path}}
          bundle exec ruby tools/dev/report_generation/support_matrix/generate.rb --allure-data ${{steps.raw_report_data.outputs.download-path}} > ./allure-report/support_matrix.html

      - name: archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-report-${{ github.run_id }}
          path: |
            ./allure-report
