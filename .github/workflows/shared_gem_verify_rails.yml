name: Shared Gem Verify Rails/PostgreSQL
on:
  workflow_call:
    inputs:
      test_commands:
        description: 'Test commands'
        required: false
        default: "bundle exec rspec"
        type: string
      dependencies:
        description: 'Array of system dependencies to install'
        required: false
        default: "[]"
        type: string
      rails_versions:
        description: 'Base Rails version requirements as a JSON array'
        required: false
        default: '["~> 7.0.0","~> 7.1.0","~> 7.2.0","~> 8.1.4.1"]'
        type: string
      additional_rails_versions:
        description: 'Additional Rails version requirements as a JSON array (for example: ["~> 8.1.0"])'
        required: false
        default: "[]"
        type: string
        # Caller example:
        # with:
        #   additional_rails_versions: '["~> 8.1.0", "~> 8.2.0"]'

env:
  # gnu.org has frequent downtime, so use the mirror at nokogiri.org
  NOKOGIRI_USE_MIRRORED_GNU_SOURCE: "t"

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      rails_versions: ${{ steps.merge_rails_versions.outputs.rails_versions }}
    steps:
      - name: Build Rails version matrix
        id: merge_rails_versions
        env:
          DEFAULT_RAILS_VERSIONS: ${{ inputs.rails_versions }}
          ADDITIONAL_RAILS_VERSIONS: ${{ inputs.additional_rails_versions }}
        run: |
          rails_versions=$(jq -cn \
            --argjson defaults "$DEFAULT_RAILS_VERSIONS" \
            --argjson extras "$ADDITIONAL_RAILS_VERSIONS" \
            '$defaults + $extras | unique')

          echo "rails_versions=$rails_versions" >> "$GITHUB_OUTPUT"
        shell: bash

  test:
    needs: prepare_matrix
    runs-on: ${{ matrix.ruby.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - { version: '3.2', os: ubuntu-latest }
          - { version: '3.3', os: ubuntu-latest }
          - { version: '3.4', os: ubuntu-latest }
          - { version: '4.0', os: ubuntu-latest }
          # The 3.5 preview has no prebuilt Ruby for newer Ubuntu runners.
          - { version: '3.5.0-preview1', os: ubuntu-24.04 }
        rails: ${{ fromJSON(needs.prepare_matrix.outputs.rails_versions) }}
        postgres:
          - '14.19'
          - '16.8'

    env:
      RAILS_ENV: test
      RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_FORCE_RUBY_PLATFORM: "${{ contains(matrix.ruby.version, 'preview') && 'true' || 'false' }}"

    name: ${{ matrix.ruby.os }} - Ruby ${{ matrix.ruby.version }} - Rails ${{ matrix.rails }} - PostgreSQL ${{ matrix.postgres }}
    steps:
      - name: Install system dependencies
        run: |
          dependencies=$(echo '${{ inputs.dependencies }}' | jq -r '.[]')
          for dep in $dependencies; do
            sudo apt-get -y --no-install-recommends install "$dep"
          done
        shell: bash

      - name: Set up PostgreSQL service
        run: |
          docker run --name postgres -d -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            --health-cmd="pg_isready" \
            --health-interval="10s" \
            --health-timeout="5s" \
            --health-retries=5 \
            postgres:${{ matrix.postgres }}

      - name: Wait for PostgreSQL to be healthy
        run: |
          docker exec postgres sh -c 'until pg_isready -U postgres; do echo waiting for postgres; sleep 2; done; echo postgres is ready'

      - name: Install matching PostgreSQL client
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: |
          postgres_major="${POSTGRES_VERSION%%.*}"
          # Newer pg_dump versions can emit SQL unsupported by the test server.
          # https://www.postgresql.org/download/linux/ubuntu/
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-client-${postgres_major}"
          echo "/usr/lib/postgresql/${postgres_major}/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Log PostgreSQL versions
        run: |
          pg_dump --version
          psql --version
          docker exec postgres psql -U postgres -c 'SHOW server_version;'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby.version }}
          bundler-cache: true

      - name: Update Rails version
        run: |
          # setup-ruby enables deployment for existing lockfiles; allow the Rails switch.
          bundle config set --local deployment false

          # Add the gem explicitly if it doesn't exist
          if ! grep -q "gem ['\"]rails['\"]" Gemfile; then
            echo 'gem "rails"' >> Gemfile          
          fi
          
          # Ensure the gem is on the latest version
          ruby -pi -e "gsub(/gem ['\"]rails['\"](, *['\"].*['\"])?/, \"gem 'rails', '${{ matrix.rails }}'\")" Gemfile
          bundle update
          bundle config set --local deployment true
          bundle install
          bundle show rails
        shell: bash

      - name: Test
        run: ${{ inputs.test_commands }}
